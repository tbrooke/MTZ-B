name: Deploy

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Build admin JS
        run: npm ci && npm run build

      - name: Set up Clojure
        uses: DeLaGuardo/setup-clojure@13
        with:
          cli: latest

      - name: Cache Clojure deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.clojure
          key: clojure-${{ hashFiles('deps.edn') }}
          restore-keys: clojure-

      - name: Build CSS
        run: clj -M:run css

      - name: Build uberjar
        run: clj -T:build uber

      - name: Deploy to server
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SERVER: ${{ secrets.DEPLOY_HOST }}
        run: |
          echo "$SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          scp -i /tmp/deploy_key -o StrictHostKeyChecking=no \
            target/mtzion.jar tmb@$SERVER:/home/tmb/mtz/mtzion.jar.new
          ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no tmb@$SERVER \
            "mv /home/tmb/mtz/mtzion.jar.new /home/tmb/mtz/mtzion.jar && \
             sudo systemctl restart mtzion"
          rm /tmp/deploy_key

# /etc/nginx/conf.d/mtz-upstream.conf
#
# THE FLIP LIVES HERE. Both mtzcg.com and mtzionchinagrove.com proxy to this
# upstream, so changing the port below and reloading nginx switches the public
# site between the new app and the old Alfresco CMS.
#
#   3100 = mtz-b      (the new Biff app, in Docker)
#   3000 = mtz-cms    (the old Alfresco site)
#
# Use deploy/flip.sh rather than editing by hand — it refuses to point at a
# port that nothing is serving.

upstream mtz_site {
    server 127.0.0.1:3100;
    keepalive 16;
}

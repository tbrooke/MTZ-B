# /etc/nginx/conf.d/mtz-upstream.conf
#
# THE FLIP LIVES HERE. mtzcg.com proxies to this upstream, so changing the port
# below and reloading nginx switches the public site between the two builds.
#
#   3100 = mtz-b      (current Biff app, in Docker, bind-mounted storage)
#   3000 = mtz-cms    (previous Biff build from May 2026, host network,
#                      database inside the container)
#
# mtzionchinagrove.com is deliberately NOT wired to this upstream — it stays
# pinned to the old build so it remains available as a reference copy.
#
# Use deploy/flip.sh rather than editing by hand — it refuses to point at a
# port that nothing is serving, and validates before reloading.

upstream mtz_site {
    server 127.0.0.1:3100;
    keepalive 16;
}

# /etc/nginx/sites-available/mtzion
# After editing: sudo nginx -t && sudo systemctl reload nginx
# SSL: sudo certbot --nginx -d mtzcg.com -d www.mtzcg.com

server {
    listen 80;
    server_name mtzcg.com www.mtzcg.com;

    # Certbot will add the SSL block below this line

    location / {
        proxy_pass         http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Allow larger uploads (bulletins, sermon PDFs)
        client_max_body_size 50M;
    }
}

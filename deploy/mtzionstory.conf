# /etc/nginx/sites-available/mtzionstory
# Points the Alfresco/mtz-cms app (port 3000) at its new domain.
#
# Steps:
#   1. Register mtzionstory.org and point DNS A record at trust's IP
#   2. sudo cp mtzionstory.conf /etc/nginx/sites-available/mtzionstory
#   3. sudo ln -s /etc/nginx/sites-available/mtzionstory /etc/nginx/sites-enabled/mtzionstory
#   4. sudo nginx -t && sudo systemctl reload nginx
#   5a. Cloudflare proxy (easiest — no cert needed):
#       Enable Cloudflare proxy for the domain, set SSL mode to "Flexible"
#   5b. Let's Encrypt (self-managed cert):
#       sudo certbot --nginx -d mtzionstory.org -d www.mtzionstory.org
#
# Do this BEFORE switching mtzcg.com to port 8090.

server {
    listen 80;
    server_name mtzionstory.org www.mtzionstory.org;

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_buffering    off;
    }
}
